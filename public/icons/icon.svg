<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a2e"/>
      <stop offset="100%" style="stop-color:#0a100d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  
  <!-- Cameroon flag stripe -->
  <rect x="0" y="0" width="512" height="8" fill="#009a44"/>
  <rect x="0" y="0" width="170.67" height="8" fill="#009a44"/>
  <rect x="170.67" y="0" width="170.67" height="8" fill="#ce1126"/>
  <rect x="341.34" y="0" width="170.66" height="8" fill="#fcd116"/>
  
  <!-- Trophy icon -->
  <g transform="translate(128, 120)">
    <!-- Cup body -->
    <path d="M64 0 L192 0 L192 160 Q192 220 128 240 Q64 220 64 160 Z" fill="#f5c518"/>
    <!-- Cup handles -->
    <path d="M64 40 Q20 40 20 100 Q20 140 64 140" stroke="#f5c518" stroke-width="24" fill="none"/>
    <path d="M192 40 Q236 40 236 100 Q236 140 192 140" stroke="#f5c518" stroke-width="24" fill="none"/>
    <!-- Base -->
    <rect x="88" y="240" width="80" height="20" rx="4" fill="#f5c518"/>
    <rect x="68" y="260" width="120" height="16" rx="4" fill="#f5c518"/>
  </g>
  
  <!-- CMR text -->
  <text x="256" y="460" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" fill="#f5c518" text-anchor="middle" letter-spacing="8">CMR</text>
</svg>
