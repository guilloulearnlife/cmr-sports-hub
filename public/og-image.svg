<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a2e"/>
      <stop offset="100%" style="stop-color:#0a100d"/>
    </linearGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="32" height="32">
      <circle cx="16" cy="16" r="1.5" fill="#f5c518" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-og)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Cameroon flag stripes top -->
  <rect x="0" y="0" width="400" height="8" fill="#009a44"/>
  <rect x="400" y="0" width="400" height="8" fill="#ce1126"/>
  <rect x="800" y="0" width="400" height="8" fill="#fcd116"/>
  
  <!-- Cameroon flag stripes bottom -->
  <rect x="0" y="622" width="400" height="8" fill="#009a44"/>
  <rect x="400" y="622" width="400" height="8" fill="#ce1126"/>
  <rect x="800" y="622" width="400" height="8" fill="#fcd116"/>
  
  <!-- Trophy icon -->
  <g transform="translate(100, 180)">
    <path d="M40 0 L120 0 L120 100 Q120 140 80 155 Q40 140 40 100 Z" fill="#f5c518"/>
    <path d="M40 25 Q12 25 12 62 Q12 88 40 88" stroke="#f5c518" stroke-width="14" fill="none"/>
    <path d="M120 25 Q148 25 148 62 Q148 88 120 88" stroke="#f5c518" stroke-width="14" fill="none"/>
    <rect x="55" y="155" width="50" height="12" rx="3" fill="#f5c518"/>
    <rect x="42" y="167" width="76" height="10" rx="3" fill="#f5c518"/>
  </g>
  
  <!-- Main text -->
  <text x="300" y="280" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="#f5c518" letter-spacing="6">CMR SPORTS</text>
  <text x="300" y="370" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="6">HUB</text>
  
  <!-- Subtitle -->
  <text x="300" y="430" font-family="Arial, sans-serif" font-size="28" fill="#7a9c80" letter-spacing="4">LE SPORT CAMEROUNAIS EN DIRECT</text>
  
  <!-- Sports icons -->
  <g transform="translate(300, 480)">
    <text font-size="48">⚽</text>
    <text x="80" font-size="48">🏀</text>
    <text x="160" font-size="48">🏐</text>
    <text x="240" font-size="48">🤾</text>
    <text x="320" font-size="48">🎱</text>
    <text x="400" font-size="48">🥊</text>
  </g>
  
  <!-- URL -->
  <text x="1100" y="590" font-family="Arial, sans-serif" font-size="20" fill="#4a6e52" text-anchor="end">cmr-sports-hub.vercel.app</text>
</svg>
